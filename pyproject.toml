[project]
name = "tr"
version = "0.1.0"
description = "ARES-TRON: Adaptive Reasoning Enterprise Strategist"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "chromadb>=1.5.4",
    "click>=8.3.1",
    "ollama>=0.6.1",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "rich>=14.3.3",
    "sqlite-vec>=0.1.6",
    "term-image>=0.7.2",
    # Textual TUI framework (90% de la interfaz AgenteDeCambio)
    "textual>=8.1.1",
    "textual-dev>=1.7.0",
    # httpx para streaming asíncrono (DeepSeek API)
    "httpx>=0.25.0",
    # notcurses: Usar paquete del sistema (python3-notcurses)
    # No instalar desde PyPI porque no es compatible con libnotcurses del sistema
    "kuzu>=0.11.3",
]

[tool.uv]
# System package: python3-notcurses (APT)
# El wrapper Python oficial tiene problemas de compilación con la versión del sistema

# Rust toolchain requerida para componentes Ratatui (10% de la interfaz)
# Instalar con: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh
# Luego: source ~/.cargo/env (ya está en .zshrc de ARES)
