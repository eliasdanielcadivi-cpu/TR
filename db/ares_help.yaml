commands:
  ares:
    description: "🚀 Abre el ARES Hub (Dashboard táctico)"
    usage: "ares"
    category: "Core"
    details: "Lanza interfaz principal. Si Kitty no corre, intenta inicializar."

  p:
    description: "🤖 Consulta Inteligente (Modo Experto)"
    usage: "ares p [PROMPT] [-m MODEL] [-t TEMPLATE] [--rag DATASET] [--think]"
    category: "IA"
    examples: "ares p 'explica Python' -m gemma | ares p 'codifica algo' -t code --rag codigo"
    options:
      - "-m, --model": "gemma, deepseek, openrouter, ares, ares-think"
      - "-t, --template": "code, chat, tools (comportamiento IA)"
      - "--rag": "docs, skills, codigo, config (contexto extra)"
      - "--think": "Usa ares-think:latest (razonamiento profundo)"

  i:
    description: "💬 Modo Interactivo (REPL con IA)"
    usage: "ares i [--rag DATASET] [-m MODEL] [--think]"
    category: "IA"
    examples: "ares i --rag docs | ares i -m deepseek --think"
    commands:
      "/quit o /exit": "Salir | /model <nombre>": "Cambiar modelo | /rag <dataset>": "Cambiar RAG"
      "/think on|off": "Modo pensante | /clear": "Limpiar | /help": "Ayuda"
    details: "REPL con emojis PNG (Term-Image). Streaming en tiempo real."

  apollo:
    description: "🧠 Sistema Apollo (RAG + CRM)"
    usage: "ares apollo ingest [ARCHIVO]"
    category: "IA"
    examples: "ares apollo ingest documento.pdf"
    details: "RAG híbrido: SQLite + sqlite-vec + Ollama embeddings. Ingiere documentos para búsqueda semántica."

  model-creator:
    description: "🛠️ Gestor de Modelos Ollama"
    usage: "ares model-creator [list|create|update|delete|show]"
    category: "IA"
    examples: "ares model-creator list | ares model-creator create mi-modelo --parent gemma:7b"
    details: "Crea, actualiza, elimina modelos Ollama. Muestra Modelfiles asociados."

  modelfile-creator:
    description: "📝 Gestor de Modelfiles YAML"
    usage: "ares modelfile-creator [list|create|update|delete|show]"
    category: "IA"
    examples: "ares modelfile-creator create chat-system --template code"
    details: "Gestiona plantillas YAML de comportamiento IA (templates/)."

  gs:
    description: "💾 Gestión de Sesiones Kitty"
    usage: "ares gs [save|list|restore|deploy|com|edit]"
    category: "Gestión"
    examples: "ares gs save | ares gs list | ares gs deploy diaria"
    subcommands:
      save: "Guarda estado actual (ventanas, pestañas, colores)"
      list: "Lista sesiones en db/"
      restore: "Reconstruye sesión en ventana actual"
      deploy: "Despliega en ventana/socket NUEVO (genera socket único automático)"
      com: "Envía comando a pestaña: ares gs com 'TITLE' 'comando'"
      edit: "Edita sesión JSON en micro: ares gs edit diaria"

  diario:
    description: "📅 Despliega sesión diaria"
    usage: "ares diario"
    category: "Gestión"
    examples: "ares diario"
    details: "Alias de 'ares gs deploy diaria'. Edita con 'ares diario-edit'. Config en db/diaria.json."

  diario-edit:
    description: "✏️ Edita sesión diaria"
    usage: "ares diario-edit"
    category: "Gestión"
    examples: "ares diario-edit"
    details: "Alias de 'ares gs edit diaria'. Abre db/diaria.json en micro. Valida JSON y crea backup automático."

  plan:
    description: "🚩 Despliegue Táctico (4 pestañas)"
    usage: "ares plan"
    category: "Táctico"
    examples: "ares plan"
    details: "Lanza 4 pestañas Hacker Neon: CYBERPUNK, NEON, MATRIX, BLADE. Colores fijos del ciclo maestro."

  zshplan:
    description: "⚔️ Despliegue Táctico ZSH"
    usage: "ares zshplan"
    category: "Táctico"
    examples: "ares zshplan"
    details: "Sesión Hacker AI con ZSH configurado. Entorno ZDOTDIR en config/zsh."

  mcat-demo:
    description: "🛠️ Mcat Demo (4 pestañas)"
    usage: "ares mcat-demo"
    category: "Táctico"
    examples: "ares mcat-demo"
    details: "Fases: A) Parseo y Temas (PDF, código), B) Conversión (ZIP→MD, HTML→PNG), C) Multimedia (imágenes, ls con thumbs), D) Interactivo (selector, zoom/pan PDF)."

  status:
    description: "🔍 Diagnóstico Integral"
    usage: "ares status"
    category: "Gestión"
    examples: "ares status"
    details: "Verifica: socket Kitty, handshakes IA, conectividad modelos, enlaces simbólicos config."

  config:
    description: "⚙️ Configuración Global"
    usage: "ares config"
    category: "Gestión"
    examples: "ares config"
    details: "Muestra: identidad (window_title), sockets (kitty, path), provider IA, modelos activos."

  init:
    description: "🛠️ Gestión de Infraestructura"
    usage: "ares init [--link|--status|--reload]"
    category: "Gestión"
    examples: "ares init -l | ares init -s | ares init -r"
    options:
      - "--link, -l": "Enlaza config Kitty con ARES (symlink kitty.conf)"
      - "--status, -s": "Verifica estado: enlaces, directorios, permisos"
      - "--reload, -r": "Recarga config en Kitty caliente (sin reiniciar)"
    details: "Inicializa infraestructura: enlaces simbólicos, valida directorios, recarga configuración en caliente."

  model:
    description: "⚙️ Configura Provider IA"
    usage: "ares model [gemma|deepseek]"
    category: "IA"
    examples: "ares model gemma | ares model deepseek"
    details: "Cambia provider por defecto: gemma (Ollama local) o deepseek (API remota)."

  models:
    description: "📦 Lista Modelos"
    usage: "ares models"
    category: "IA"
    examples: "ares models"
    details: "Lista modelos disponibles por provider (Ollama, DeepSeek, OpenRouter)."

  templates:
    description: "📄 Catálogo de Plantillas"
    usage: "ares templates"
    category: "IA"
    examples: "ares templates"
    details: "Lista plantillas YAML: default, chat, code, tools (comportamiento IA por contexto)."

  tools:
    description: "🛠️ Herramientas (Function Calling)"
    usage: "ares tools"
    category: "IA"
    examples: "ares tools"
    details: "Inventario: google_search, translate, weather, shell, file_ops (herramientas IA)."

  video:
    description: "🎬 Reproductor de Video"
    usage: "ares video [ARCHIVO]"
    category: "Multimedia"
    examples: "ares video /path/to/video.mp4"
    details: "Usa mpv con protocolo gráfico Kitty. Integración fluida en terminal."

  image:
    description: "🖼️ Visualizador de Imágenes"
    usage: "ares image [ARCHIVO]"
    category: "Multimedia"
    examples: "ares image /path/to/image.png"
    details: "Usa icat (kitten). Renderizado nativo en celda de terminal."

  socket-check:
    description: "🔍 Verifica Sockets"
    usage: "ares socket-check [SOCKET] [--json]"
    category: "Gestión"
    examples: "ares socket-check | ares socket-check unix:/tmp/custom --json"
    details: "Diagnostica sockets: existencia, permisos, procesos. --json para scripting."

  help:
    description: "📚 Navegador de Documentación"
    usage: "ares help"
    category: "Core"
    examples: "ares help"
    details: "Abre docs/ con Broot (navegación jerárquica). Índice, skills, bitácoras."

ecosystem_tools:
  ini: "Ciclo de vida: ini venv (entorno), ini prod (publica en /usr/bin), ini env (variables)"
  repo: "Git táctico: backup comprimido, auditoría de repositorio"
  aviso: "Recordatorios: lenguaje natural + daemon (aviso 'mañana a las 9')"
  tr-color: "Pigmenta pestañas: tr-color <ruta> (match por ruta → color/título)"
  tr-investigador: "Web research: buscar, otear, consultar docs (Google + web scraping)"

sub_agents:
  sherlok: "Auditor de código: codellama, qwen, deepseek (ADN Técnico Industrial)"
