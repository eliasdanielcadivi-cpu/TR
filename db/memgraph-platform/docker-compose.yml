services:
  memgraph:
    image: memgraph/memgraph-mage:latest
    container_name: memgraph-mage
    pull_policy: always
    ports:
      - "7687:7687"
      - "7444:7444"
    # Volvemos a la sintaxis base pero con persistencia robusta
    command: ["--log-level=TRACE", "--storage-snapshot-on-exit=true", "--storage-snapshot-interval-sec=300", "--storage-wal-enabled=true"]
    volumes:
      - mg_data:/var/lib/memgraph

  lab:
    image: memgraph/lab:latest
    container_name: memgraph-lab
    pull_policy: always
    ports:
      - "3000:3000"
    depends_on:
      - memgraph
    environment:
      - QUICK_CONNECT_MG_HOST=memgraph
      - QUICK_CONNECT_MG_PORT=7687

volumes:
  mg_data:
